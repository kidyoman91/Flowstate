<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FLOWSTATE — Connexion</title>
  <meta name="description" content="Accès sécurisé à votre espace personnel FLOWSTATE">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0e17">
  <!-- iOS Safari PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flowstate">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <script>
    // If already authenticated and "remember me" was checked, redirect directly to app.html
    if (localStorage.getItem('flowstate_auth') === 'valid' || sessionStorage.getItem('flowstate_auth') === 'valid') {
      window.location.replace('app.html');
    }
  </script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <!-- Ambient Floating Glowing Orbs -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>
  <div class="ambient-noise" aria-hidden="true"></div>

  <!-- Dedicated Login Card -->
  <main class="login-card" id="loginCard" style="z-index: 10;">
    <div class="login-brand-logo">
      <svg viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>

    <h1 class="login-title">FLOWSTATE</h1>
    <p class="login-subtitle">Connexion à votre espace personnel</p>

    <!-- Error message alert -->
    <div class="login-error-msg" id="loginErrorMsg"></div>

    <form id="loginForm" autocomplete="on">
      <div class="login-field-wrap">
        <label class="login-field-label" for="loginUsername">Identifiant</label>
        <div class="login-input-container">
          <span class="login-input-icon">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input 
            type="text" 
            class="login-input" 
            id="loginUsername" 
            name="username" 
            placeholder="UserFlowState1" 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>
      </div>

      <div class="login-field-wrap">
        <label class="login-field-label" for="loginPassword">Mot de passe</label>
        <div class="login-input-container">
          <span class="login-input-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            type="password" 
            class="login-input" 
            id="loginPassword" 
            name="password" 
            placeholder="••••••••••••" 
            autocomplete="current-password" 
            required
          >
          <button type="button" class="btn-toggle-pass" id="btnTogglePassword" title="Afficher/Masquer le mot de passe">👁️</button>
        </div>
      </div>

      <div class="login-remember-row">
        <label class="login-remember-label">
          <input type="checkbox" class="login-remember-checkbox" id="loginRememberMe">
          Rester connecté sur cet appareil
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="btnSubmit" style="width: 100%; padding: 0.95rem; font-size: 1rem;">
        Entrer dans Flowstate ⚡
      </button>
    </form>
  </main>

  <script>
    // Registered Accounts (Adam + friends)
    const REGISTERED_USERS = {
      'adamflowstate': {
        displayName: 'Adam',
        pass: 'Lv18102002@'
      },
      'raphflowstate': {
        displayName: 'Raphaël',
        pass: 'Raph2005!'
      }
    };

    const loginForm = document.getElementById('loginForm');
    const userInput = document.getElementById('loginUsername');
    const passInput = document.getElementById('loginPassword');
    const rememberInput = document.getElementById('loginRememberMe');
    const errorMsg = document.getElementById('loginErrorMsg');
    const loginCard = document.getElementById('loginCard');
    const togglePassBtn = document.getElementById('btnTogglePassword');
    const btnSubmit = document.getElementById('btnSubmit');

    // Toggle password visibility
    if (togglePassBtn && passInput) {
      togglePassBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        togglePassBtn.textContent = isPass ? '🙈' : '👁️';
      });
    }

    // Submit handler
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredUser = (userInput.value || '').trim().toLowerCase();
      const enteredPass = (passInput.value || '').trim();

      const userRecord = REGISTERED_USERS[enteredUser];

      if (userRecord && userRecord.pass === enteredPass) {
        errorMsg.style.display = 'none';
        btnSubmit.textContent = 'Connexion réussie... 🚀';
        btnSubmit.style.opacity = '0.8';

        const storage = rememberInput.checked ? localStorage : sessionStorage;
        storage.setItem('flowstate_auth', 'valid');
        storage.setItem('flowstate_current_user', enteredUser);
        storage.setItem('flowstate_display_name', userRecord.displayName || enteredUser);

        // Nettoyage de l'autre storage pour éviter tout conflit
        if (rememberInput.checked) {
          sessionStorage.removeItem('flowstate_auth');
          sessionStorage.removeItem('flowstate_current_user');
          sessionStorage.removeItem('flowstate_display_name');
        } else {
          localStorage.removeItem('flowstate_auth');
          localStorage.removeItem('flowstate_current_user');
          localStorage.removeItem('flowstate_display_name');
        }

        setTimeout(() => {
          window.location.href = 'app.html';
        }, 300);
      } else {
        errorMsg.textContent = 'Identifiant ou mot de passe incorrect.';
        errorMsg.style.display = 'block';

        // Shake animation
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; // Trigger reflow
        loginCard.classList.add('shake');

        passInput.value = '';
        passInput.focus();
      }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
